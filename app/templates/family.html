<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6f8ff">
<title>小暖 · 家属端</title>
<style>
:root{--blue:#3d6df2;--deep:#173baf;--ink:#17233d;--muted:#7f8ba3;--line:#e9edf6;--canvas:#f6f8ff;--tint:#edf2ff;--card:#fff;--mint:#45c495;--amber:#f0a958}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding:10px 16px 102px;background:linear-gradient(180deg,#f5f8ff 0,#fff 28%,#f8faff 100%)}.top{height:59px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#557eff,#315ce1);color:#fff;display:grid;place-items:center;box-shadow:0 8px 17px rgba(55,99,232,.25);font-weight:750}.brand b{display:block;font-size:16px;letter-spacing:-.03em}.brand small{display:block;margin-top:2px;font-size:9px;color:var(--muted)}.elder{padding:7px 10px;border:1px solid #e3e9f8;border-radius:999px;background:#fff;color:#637089;font-size:10px}.view{display:none}.view.on{display:block}.welcome{padding:19px 2px 16px}.welcome span{display:block;color:var(--blue);font-weight:700;font-size:10px;letter-spacing:.1em}.welcome h1{margin:8px 0 6px;font-size:30px;line-height:1.2;letter-spacing:-.065em}.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.hero-card{position:relative;overflow:hidden;padding:19px;border-radius:24px;background:linear-gradient(135deg,#4e7cff,#2f58d9);color:#fff;box-shadow:0 17px 34px rgba(51,93,220,.27)}.hero-card:before{content:"";position:absolute;width:180px;height:180px;right:-78px;top:-95px;border-radius:50%;border:28px solid rgba(255,255,255,.09)}.hero-card:after{content:"";position:absolute;width:100px;height:100px;right:25px;bottom:-66px;border-radius:50%;background:rgba(255,255,255,.09)}.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between}.hero-top span{font-size:11px;color:rgba(255,255,255,.72)}.live{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.13);font-size:10px}.live i{width:6px;height:6px;border-radius:50%;background:#70e2b7}.hero-card h2{position:relative;margin:20px 0 7px;font-size:23px;letter-spacing:-.045em}.hero-card p{position:relative;margin:0;max-width:270px;font-size:12px;line-height:1.65;color:rgba(255,255,255,.77)}.hero-bottom{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:19px;padding-top:14px;border-top:1px solid rgba(255,255,255,.17)}.hero-bottom small{font-size:10px;color:rgba(255,255,255,.67)}.hero-bottom b{font-size:11px}.family-strip{display:flex;gap:12px;overflow-x:auto;padding:3px 1px 1px;margin-top:18px;scrollbar-width:none}.family-strip::-webkit-scrollbar{display:none}.family-pill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:72px}.family-avatar{width:60px;height:60px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#edf2ff,#dce6ff);display:grid;place-items:center;color:var(--blue);font-size:22px;font-weight:700;box-shadow:0 8px 22px rgba(44,72,139,.08);border:2px solid rgba(255,255,255,.95)}.family-avatar img{width:100%;height:100%;object-fit:cover}.family-pill span{font-size:11px;color:#66758f;white-space:nowrap}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.035em}.section-title button,.section-title span{border:0;background:none;color:var(--blue);font-size:11px}.care-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{min-height:112px;padding:14px 12px;border:1px solid #edf0f7;border-radius:18px;background:#fff;box-shadow:0 8px 25px rgba(44,72,139,.045)}.metric i{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;background:#eef3ff;color:var(--blue);font-style:normal;font-size:15px}.metric:nth-child(2) i{background:#eafaf3;color:#33a977}.metric:nth-child(3) i{background:#fff4e8;color:#d88a37}.metric b{display:block;margin-top:14px;font-size:19px;letter-spacing:-.05em}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.insight{padding:17px;border:1px solid #edf0f7;border-radius:19px;background:#fff;box-shadow:0 8px 25px rgba(44,72,139,.045)}.insight-head{display:flex;align-items:center;gap:10px}.insight-dot{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#f0f4ff;color:var(--blue);font-size:17px}.insight-head b{display:block;font-size:13px}.insight-head span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.insight p{margin:13px 0 0;color:#506078;font-size:12px;line-height:1.7}.invite{padding:17px;border-radius:20px;background:#fff;border:1px solid #edf0f7}.invite h3{margin:0;font-size:15px}.invite p{margin:6px 0 12px;color:var(--muted);font-size:11px;line-height:1.6}.primary,.ghost{height:40px;border-radius:12px;padding:0 13px;font-size:11px;font-weight:650}.primary{border:0;background:var(--blue);color:#fff;box-shadow:0 8px 16px rgba(61,109,242,.2)}.ghost{margin-left:7px;border:1px solid #dae4ff;background:#fff;color:var(--blue)}.code-box{display:none;margin-top:14px;padding:13px;border-radius:14px;background:var(--tint);text-align:center}.code-box.show{display:block}.code-num{font-size:26px;font-weight:800;letter-spacing:.18em;margin-left:.18em;color:var(--deep)}.code-box small{display:block;margin-top:5px;color:#75839e;font-size:10px}.device{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.device:first-child{border:0}.device-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:#edf2ff;color:var(--blue)}.device b{font-size:12px}.device p{margin:3px 0 0;color:var(--muted);font-size:10px}.remove{margin-left:auto;border:0;background:none;color:#d0646b;font-size:10px}.empty{padding:11px 0;color:var(--muted);font-size:11px;text-align:center}.report-card{padding:19px;border-radius:22px;background:linear-gradient(145deg,#fff,#f1f5ff);border:1px solid #e5ebfa}.report-chip{display:inline-block;padding:5px 8px;border-radius:99px;background:#fff;color:var(--blue);font-size:10px}.report-card h2{margin:12px 0 6px;font-size:23px;letter-spacing:-.05em}.report-card p{margin:0;color:#62708a;font-size:12px;line-height:1.7}.day{display:grid;grid-template-columns:43px 1fr auto;gap:7px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.day-date{font-size:11px;font-weight:700}.day-main b{font-size:11px}.day-main p{margin:3px 0 0;color:var(--muted);font-size:9px}.signal{padding:5px 7px;border-radius:8px;background:#edf8f3;color:#31956c;font-size:9px}.signal.watch{background:#fff1e8;color:#dc8b3c}.frame{width:100%;height:calc(100vh - 90px);border:0;background:transparent}.nav{position:fixed;z-index:10;left:50%;bottom:10px;display:flex;width:min(492px,calc(100% - 28px));height:67px;padding:6px;transform:translateX(-50%);border:1px solid rgba(229,235,249,.95);border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 15px 40px rgba(38,65,131,.14);backdrop-filter:blur(16px)}.nav button{flex:1;border:0;border-radius:16px;background:transparent;color:#8994aa;font-size:10px}.nav b{display:block;margin-bottom:3px;font-size:18px;font-weight:500;line-height:1}.nav button.on{background:#edf2ff;color:var(--blue)}
</style>
<style>
.app{background:linear-gradient(180deg,#f5f8ff 0,#fff 34%,#f8faff 100%)}
.top{height:58px}.mark{width:38px;height:38px;background:none;box-shadow:none;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain;transform:scale(1.45)}.care-grid,.insight,.invite{margin-top:18px}.care-grid+.insight{margin-top:18px}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">
<span class="mark"><img src="/static/images/xiaonuan-logo-care.svg" alt="小暖"></span>
<span>
<b>小暖</b>
</span>
</div>
<span id="elderName" hidden>我的家人</span>
</header>
<section class="view on" id="vHome">
<article class="hero-card">
<div class="hero-top">
<div class="live">
<i>
</i>
<span id="onlineTag">等待连接</span>
</div>
</div>
<h2 id="deviceStatus">老人端正在等待连接</h2>
<p id="deviceMeta">生成邀请码后，可在老人设备上开启语音陪聊。</p>
<div class="hero-bottom">
<small>数字分身守候中</small>
<b>查看日报 →</b>
</div>
</article>
<div class="family-strip" id="familyStrip">
</div>
<div class="care-grid">
<article class="metric">
<i>⌁</i>
<b id="turns">0</b>
<span>对话轮次</span>
</article>
<article class="metric">
<i>♡</i>
<b id="mood">—</b>
<span>情绪状态</span>
</article>
<article class="metric">
<i>◌</i>
<b id="trend">—</b>
<span>长期观察</span>
</article>
</div>
<article class="insight">
<div class="insight-head">
<div class="insight-dot">✦</div>
<div>
<b>AI 照护小结</b>
<span>基于今日对话自动整理</span>
</div>
</div>
<p id="homeSummary">正在整理今天的陪伴记录…</p>
</article>
<article class="invite">
<h3>把陪伴带到家人身边</h3>
<p>邀请码 10 分钟内有效，可用于绑定一台老人设备。</p>
<button class="primary" onclick="createInvite()">生成邀请码</button>
<button class="ghost" onclick="window.open('/play?demo=1','_blank')">体验老人端</button>
<div class="code-box" id="codeBox">
<div class="code-num" id="inviteCode">000000</div>
<small>请在老人端输入这六位数字</small>
</div>
</article>
<div class="invite" id="devices">
<div class="empty">还没有设备</div>
</div>
<span id="deviceCount" hidden>0 台</span>
</section>
<section class="view" id="vReport">
<div class="welcome">
<span>CARE INSIGHTS</span>
<h1>陪伴日报</h1>
<p>看见每天聊了什么，也温和地留意长期变化。</p>
</div>
<article class="report-card">
<span class="report-chip" id="reportMood">今日状态</span>
<h2 id="reportTitle">今天还没开始聊</h2>
<p id="reportSummary">开始陪聊后，这里会自动形成家属可读的小结。</p>
</article>
<div class="section-title">
<h2>近 14 天记录</h2>
<span id="reportTrend">数据积累中</span>
</div>
<div class="invite" id="dailyList">
</div>
<p id="disclaimer" style="margin:13px 2px;color:#8b96a9;font-size:9px;line-height:1.7">
</p>
</section>
<section class="view" id="vSettings">
<iframe class="frame" id="settingsFrame" title="照护设置">
</iframe>
</section>
</div>
<nav class="nav">
<button class="on" data-v="home" onclick="show('home')">
<b>⌂</b>首页</button>
<button data-v="report" onclick="show('report')">
<b>⌁</b>日报</button>
<button data-v="settings" onclick="show('settings')">
<b>⚙</b>设置</button>
</nav>
<script>
const $=id=>document.getElementById(id),esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};document.addEventListener('DOMContentLoaded',async()=>{await Promise.all([loadElder(),loadMembersPreview(),loadInsights(),loadDevices()]);const h=location.hash.slice(1);if(['home','report','family','settings'].includes(h))show(h)});function avatarMarkup(m){const initial=esc((m.name||'家').slice(0,1));return m.photo_path?`<img src="${m.photo_path}" alt="${esc(m.name)}" onerror="this.replaceWith(document.createTextNode('${initial}'))">`:initial}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v'+v[0].toUpperCase()+v.slice(1)));document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='family'&&!$('familyFrame').src)$('familyFrame').src='/settings-content?embed=family';if(v==='settings'&&!$('settingsFrame').src)$('settingsFrame').src='/settings-content?embed=setup';if(v==='report')loadInsights();if(v==='home'){loadDevices();loadMembersPreview()}history.replaceState(null,'','#'+v)}async function loadElder(){const r=await fetch('/api/admin/elder'),d=await r.json();$('elderName').textContent=d.elder?.name||'我的家庭'}async function loadMembersPreview(){try{const r=await fetch('/api/members'),d=await r.json(),xs=d.members||[];$('familyStrip').innerHTML=xs.length?xs.map(m=>`<div class="family-pill"><div class="family-avatar">${avatarMarkup(m)}</div><span>${esc(m.name||'家人')}</span></div>`).join(''):'<div class="empty" style="width:100%">家属头像会显示在这里</div>'}catch(e){$('familyStrip').innerHTML='<div class="empty" style="width:100%">头像暂时加载失败</div>'}}async function loadInsights(){try{const r=await fetch('/api/insights?days=14'),d=await r.json(),t=d.today,tr=d.trend;$('homeSummary').textContent=t.summary;$('turns').textContent=t.message_count;$('mood').textContent=t.mood;$('trend').textContent=tr.label;$('reportMood').textContent='情绪 · '+t.mood;$('reportTitle').textContent=t.message_count?`今天聊了 ${t.message_count} 轮`:'今天还没开始聊';$('reportSummary').textContent=t.summary;$('reportTrend').textContent=tr.label;$('dailyList').innerHTML=d.daily.slice().reverse().map(x=>`<div class="day">
<div class="day-date">${x.date.slice(5)}</div>
<div class="day-main">
<b>${x.message_count?x.topics.join('、')||'日常陪伴':'没有对话'}</b>
<p>${x.message_count}轮 · 情绪 ${x.mood}</p>
</div>
<span class="signal ${x.signals?'watch':''}">${x.signals?'需留意':'平稳'}</span>
</div>`).join('');$('disclaimer').textContent=d.disclaimer}catch(e){$('homeSummary').textContent='陪伴摘要暂时不可用，请稍后刷新。'}}async function createInvite(){const r=await fetch('/api/device/invite',{method:'POST'}),d=await r.json();$('inviteCode').textContent=d.code;$('codeBox').classList.add('show')}async function loadDevices(){const r=await fetch('/api/device/list'),d=await r.json(),xs=d.devices||[];$('deviceCount').textContent=xs.length+' 台';$('deviceStatus').textContent=xs.length?'老人端已连接':'老人端正在等待连接';$('deviceMeta').textContent=xs.length?'最近在线：'+new Date(xs[0].last_seen_at).toLocaleString('zh-CN'):'生成邀请码后，可在老人设备上开启语音陪聊。';$('onlineTag').textContent=xs.length?'已连接':'等待连接';$('devices').innerHTML=xs.length?xs.map(x=>`<div class="device">
<span class="device-icon">⌁</span>
<div>
<b>${esc(x.device_name)}</b>
<p>绑定于 ${new Date(x.bound_at).toLocaleDateString('zh-CN')}</p>
</div>
<button class="remove" onclick="unbind(${x.id})">解除</button>
</div>`).join(''):'<div class="empty">还没有设备</div>'}async function unbind(id){if(!confirm('解除这台老人设备的绑定吗？'))return;await fetch('/api/device/'+id,{method:'DELETE'});loadDevices()}
</script>
</body>
</html>
