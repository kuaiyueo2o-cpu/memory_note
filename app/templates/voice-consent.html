<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小暖声音复刻授权说明</title><style>body{max-width:720px;margin:0 auto;padding:32px 20px 60px;color:#17233d;font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}h1{font-size:27px}h2{margin-top:28px;font-size:18px}.box{padding:14px;background:#f2f6ff;border-radius:12px}</style><body><h1>声音复刻授权说明</h1><p class="box">上传前，上传人须确认：自己是录音声音主体，或已取得声音主体的明确、有效授权；不得上传未经授权的他人录音。</p><h2>处理目的</h2><p>小暖仅将录音用于生成该家人数字分身的语音陪伴内容。克隆音色不得用于冒充真人、欺诈、交易、医疗诊断或任何未经授权的用途。</p><h2>撤回与删除</h2><p>授权人可随时在家属端删除声音样本、停用克隆音色并申请删除相关生成数据。删除后，已无法恢复对应音色能力。</p><h2>使用边界</h2><p>数字分身不是现实本人，不得替真人承诺探望、转账、就医、联系或其他现实行动。服务会在适当场景提示其为授权的语音陪伴。</p></body></html>
